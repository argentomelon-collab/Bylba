<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            margin: 0 auto;
        }
        h1 { color: #4caf50; }
        p { color: #b0bec5; font-size: 1.1rem; }
        .btn {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Привет из интернета! 🚀</h1>
        <p>Я школьник, и я создал этот сайт сам прямо со своего телефона!</p>
        <a href="#" class="btn" onclick="alert('Работает!')">Жми сюда</a>
    </div>

</body>
</html>
