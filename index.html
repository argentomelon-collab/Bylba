<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Галерея</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            margin: 0 auto 40px auto; /* Отступ снизу до галереи */
        }
        h1 { color: #4caf50; }
        p { color: #b0bec5; font-size: 1.1rem; }
        .btn {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
        }
        
        /* Стили для блока с фотками */
        .gallery-title {
            font-size: 1.8rem;
            margin-top: 20px;
            color: #ff9800;
        }
        .gallery {
            display: flex;
            flex-direction: column; /* Картинки будут идти друг за другом вниз */
            gap: 20px; /* Расстояние между фотками */
            max-width: 400px;
            margin: 20px auto;
        }
        .gallery img {
            width: 100%; /* Растягивает фото по ширине экрана */
            border-radius: 12px; /* Красивые скругленные углы */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Твой старый блок -->
    <div class="card">
        <h1>Привет из интернета! 🚀</h1>
        <p>Я школьник, и я создал этот сайт сам прямо со своего телефона!</p>
        <a href="#" class="btn" onclick="alert('Работает!')">Жми сюда</a>
    </div>

    <!-- Новый блок: Заголовок галереи -->
    <h2 class="gallery-title">Похоронное бюро, Богдаши👇</h2>

    <!-- Блок с картинками -->
    <div class="gallery">
        <!-- Замени ссылки ниже на свои ссылки из ImgBB -->
            <!-- Блок с картинками -->
        <img src="https://i.ibb.co/GvrxM4Tg/IMG-20250623-142547.jpg" alt="Фото 1">
        <img src="https://ibb.co" alt="Фото 2 с квасом">
        <img src="https://i.ibb.co/R40b59K6/image0.jpg" alt="Фото 3">
        <img src="https://i.ibb.co/KcJShgzR/image1.jpg" alt="Фото 4">
    </div>
    
</body>
</html>
